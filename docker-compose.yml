services:
  postgres:
    image: postgres:16
    container_name: cardui-postgres
    environment:
      POSTGRES_USER: cardui_user
      POSTGRES_PASSWORD: cardui_dev_password
      POSTGRES_DB: cardui
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cardui_pgdata:/var/lib/postgresql/data

volumes:
  cardui_pgdata: